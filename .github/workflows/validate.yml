name: Validate game data and art

on:
  push:
    branches:
      - codex/art-direction-v1
      - codex/art-direction-v2
      - codex/art-direction-v3
      - codex/art-direction-v4-story-mode
      - codex/v5-fit-and-scroll-fixes
      - codex/v6-character-fit-fixes
      - feature/kids-dressup-game-v1
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node --check data.js
          node --check outfit-rules.js
          node --check sw.js
          node --check assets/assetRegistry.js
      - name: Validate game data
        run: node check-data.js
      - name: Validate outfit state rules
        run: node scripts/test-outfit-rules.js
      - name: Validate character art compatibility
        run: node scripts/test-character-compatibility.js
      - name: Audit registered PNG art
        run: node audit-assets.js
      - name: Require complete story mode art
        run: node scripts/audit-story-mode.js --strict
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: |
          python3 -m http.server 4173 >/tmp/seyeon-http.log 2>&1 &
          node scripts/browser-smoke.mjs
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-browser-smoke
          path: qa/browser-smoke
          if-no-files-found: warn
      - name: Verify runtime WebP freshness
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/verify-runtime-assets.py
